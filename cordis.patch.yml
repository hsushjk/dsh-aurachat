# AuraChat-Web —— DSH bundle patch（插件自带的挂载声明）
#
# 1) aurachat：插件本体（宿主半边 src/host.js + 网页半边 public/）
# 2) 两个 agent preset，只给 AuraChat-Web 自己建的会话用：
#    - aurachat-owner：主人私聊，完整工具 + AuraChat人格
#    - aurachat-guest ：客人聊天，没有任何本地工具（shell / 文件 / 网络），只有插件按会话挂的网页工具
#    人格通过提示词变量 {{aurachat_persona}} 放在系统提示词最前面（由插件注册，面板切换人格即时生效）。
- insert:
    - id: aurachat
      name: dsh-aurachat
    - id: preset-aurachat-owner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aurachat-owner
        name: AuraChat · 主人私聊
        description: AuraChat在网页上和主人私聊时用：人格 + 完整工具
        order: 60
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{aurachat_persona}}\n\n{{aurachat_rules_owner}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
    - id: preset-aurachat-guest
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aurachat-guest
        name: AuraChat · 客人聊天
        description: AuraChat在网页上和客人聊天时用：人格 + 只有网页社交工具，没有任何电脑操作能力
        order: 61
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{aurachat_persona}}\n\n{{aurachat_rules_social}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
